name: Publish to Verdaccio

# Publish the package to the private Verdaccio (UPM) registry whenever a GitHub
# Release is published. Create a release (tag = the package.json version, e.g. v0.1.0)
# and this runs npm publish against https://upm.wtfgames.com.ua/.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Writes an .npmrc pointing at Verdaccio and wiring NODE_AUTH_TOKEN for auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://upm.wtfgames.com.ua/

      # publishConfig.registry in package.json also targets Verdaccio.
      - run: npm publish
        env:
          # Add this token in the repo's Settings > Secrets and variables > Actions.
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
